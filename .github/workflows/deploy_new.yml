# Temporary workflow file for editing
name: Deploy to Vercel

on:
  push:
    branches: [ FamilyGuyStyle ]  # деплой с ветки FamilyGuyStyle

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Navigate to aboutme directory
        run: cd aboutme
        
      - name: Install dependencies
        working-directory: ./aboutme
        run: npm ci
        
      - name: Build project
        working-directory: ./aboutme
        # We're using hardcoded EmailJS config values, so we don't need environment variables
        run: npm run build
        
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Deploy to Vercel
        working-directory: ./aboutme
        run: vercel --prod --confirm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}