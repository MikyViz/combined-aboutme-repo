# Temporary workflow file for editing
name: Deploy to Vercel

on:
  push:
    branches: [ FamilyGuyStyle ]  # деплой с ветки FamilyGuyStyle

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Navigate to aboutme directory
        run: cd aboutme
        
      - name: Install dependencies
        working-directory: ./aboutme
        run: npm ci
        
      - name: Build project
        working-directory: ./aboutme
        # We're using hardcoded EmailJS config values, so we don't need environment variables
        run: npm run build
        
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        working-directory: ./aboutme
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project Artifacts
        working-directory: ./aboutme
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy prebuilt project to Vercel
        working-directory: ./aboutme
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}